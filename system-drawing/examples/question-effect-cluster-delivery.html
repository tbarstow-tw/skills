.scroll{overflow-x:auto;background:var(--sheet);border:1.2px solid var(--ink);border-radius:16px}
svg{display:block;width:100%;min-width:1100px;height:auto}
.tb{background:var(--sheet);display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;margin-bottom:24px;border:1.2px solid var(--ink);border-radius:16px;overflow:hidden}
.tb>div{border-right:.8px solid var(--ink);border-bottom:.8px solid var(--ink);padding:10px 14px;min-width:0}
.tb>div:nth-child(4),.tb>div:nth-child(7){border-right:0}
.tb .big{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tb h1{font-weight:400;letter-spacing:.1em;font-size:clamp(26px,3.6vw,40px);line-height:1.05;margin:4px 0 0;text-transform:uppercase}
.lbl{text-transform:uppercase;font-size:9.5px;letter-spacing:.06em;color:var(--ink2)}
.tb .v{font-size:12.5px;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere}
.tb .big .v{font-size:11px;color:var(--ink2);line-height:1.6;text-transform:none;letter-spacing:.02em}
.tb .notes{grid-column:1/-1;border-right:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;line-height:1.8}
.tb .notes ol{margin:4px 0 0;padding-left:20px}
.tb .nh{font-weight:700;font-size:13px;letter-spacing:.06em}
.tb .nh span{font-weight:400;font-size:11px;margin-left:6px}
/* Dividers are shadows so they run the full cell height; the card clips the ones on its outer edge. */
.tb .figs{grid-column:1/-1;border-right:0;border-bottom:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0}
.tb .figs>div{padding:10px 14px;box-shadow:-.8px 0 0 var(--ink),0 -.8px 0 var(--ink)}
.tb .figs .v{font-size:15px;letter-spacing:.04em;text-transform:none;margin-top:4px}
@media (max-width:640px){.tb{grid-template-columns:1fr 1fr}.tb .big{grid-column:1/-1;grid-row:auto}}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:10px 2px 0}
.foot b{font-weight:700;color:var(--ink)}
.appx{background:var(--sheet);margin-top:28px;padding:20px 24px;border:1.2px solid var(--ink);border-radius:16px}
.appx h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}
.appx h2:first-child{margin-top:0}
.appx table{border-collapse:collapse;width:100%;font-size:12px}
.appx th,.appx td{border:.8px solid var(--ink3);padding:4px 8px;text-align:left;vertical-align:top}
.appx th{font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.appx td.c{white-space:nowrap;font-weight:700}
.appx code{font-size:11px;overflow-wrap:anywhere}
/* drawing */
.obj{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.cmp{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.ctx{fill:var(--sheet);stroke:var(--ink2);stroke-width:.6}
.k-store{fill:var(--fill)}
.k-ext{fill:var(--fill2)}
.tbd{stroke-dasharray:2 2}
.thin{fill:none;stroke:var(--ink);stroke-width:.8}
.plane{fill:var(--sheet);stroke:var(--ink);stroke-width:.8}
.ph{fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:14 3 3 3}
.cl{fill:none;stroke:var(--ink3);stroke-width:.7;stroke-dasharray:16 3 2 3}
.bnd{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:10 3 2 3}
.dep{fill:none;stroke:var(--ink2);stroke-width:.55}
.call{fill:none;stroke:var(--ink);stroke-width:.9}
.msg{fill:none;stroke:var(--ink);stroke-width:.9;stroke-dasharray:4 3}
.data{fill:none;stroke:var(--ink);stroke-width:.9}
.crit{stroke-width:1.5}
.arrow{fill:var(--ink)}
.arrowo{fill:none;stroke:var(--ink);stroke-width:1}
.hl{stroke:var(--ink2);stroke-width:.7}
.hs{stroke:var(--ink);stroke-width:.6}
.lead{stroke:var(--ink);stroke-width:.7;fill:none}
.dot{fill:var(--ink)}
.dt{font:400 11px var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.dts{font:400 9.5px var(--f);fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.cc{font:700 11px var(--f);fill:var(--ink);letter-spacing:.04em}
.sl{font:400 9px var(--f);fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.nt{font:400 10.5px var(--f);fill:var(--ink);letter-spacing:.05em;text-transform:uppercase}
.nth{font:700 13px var(--f);fill:var(--ink);letter-spacing:.06em}
.vt{font:400 12px var(--f);fill:var(--ink);letter-spacing:.1em;text-transform:uppercase}
.nb{fill:var(--sheet);stroke:var(--ink);stroke-width:.9}
.nbt{font:400 9.5px var(--f);fill:var(--ink)}
.stc{fill:var(--sheet);stroke:var(--ink);stroke-width:.9}
.stt{font:700 8.5px var(--f);fill:var(--ink)}
.th{font:400 9px var(--f);fill:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.tc{font:400 9.5px var(--f);fill:var(--ink)}
.tbk{font:400 7px var(--f);fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.ko{paint-order:stroke;stroke:var(--fill2);stroke-width:3px;stroke-linejoin:round}
.iso{font:700 8px var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px}
</style>

const val=(o,v)=>o.confidence==='TBD'?'[TBD]':v;
function tables(){let y=82;const x=1396;
 const drawn=new Set();sv.querySelectorAll('text').forEach(t=>(t.textContent.match(/\b[CDXIBTLNM][0-9]+\b/g)||[]).forEach(c=>drawn.add(c)));
 M.key_figures.forEach(f=>drawn.add(f.code));M.notes.forEach(n=>(n.text.match(/\b[CDXIBTLNM][0-9]+\b/g)||[]).forEach(c=>drawn.add(c)));
 PI.forEach(i=>G0(i).forEach(c=>drawn.add(c)));
 const shown=a=>a.filter(o=>drawn.has(o.code)).sort(byCode);
 y=table(x,y,'Components',shown(M.components).map(c=>[lab(c),c.name,val(c,c.kind),ev(c)]));
 y=table(x,y,'Interfaces',shown(M.interfaces).map(i=>[lab(i),i.name,val(i,i.protocol),ev(i)]));
 if((M.boundaries||[]).length)y=table(x,y,'Boundaries',M.boundaries.slice().sort(byCode).map(b=>[lab(b),b.name,val(b,b.kind),ev(b)]));
 if(shown(M.budgets||[]).length)y=table(x,y,'Budgets',shown(M.budgets).map(b=>[lab(b),b.name,val(b,b.value),ev(b)]));
 sv.setAttribute('data-table-bottom',y);sv.setAttribute('data-skipped-frames',SKIPPED.join('; '))}

/* ---- register (HTML below the sheet) ---- */
function register(){const s=M.subject,r=[];const td=(v,c)=>'<td'+(c?' class="c"':'')+'>'+v+'</td>';
 const tbl=(h,rows)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.join('')+'</table>';
 r.push('<h2>Sources</h2>'+tbl(['Repository','Ref','Commit','Date'],s.sources.map(x=>'<tr>'+td(esc(x.name),1)+td(esc(x.ref))+td('<code>'+esc(x.sha)+'</code>')+td(esc(x.date||''))+'</tr>')));
 r.push('<h2>Components</h2>'+tbl(['Code','Name','Lane','Scope','Responsibility','Confidence','Evidence'],M.components.slice().sort(byCode).map(c=>'<tr>'+td(lab(c),1)+td(esc(c.name)+(c.plan===false?' (not on plan)':''))+td(c.lane)+td(c.scope)+td(esc(c.responsibility))+td(c.confidence)+td(esc((c.evidence||[]).join(', ')))+'</tr>')));
 r.push('<h2>Interfaces</h2>'+tbl(['Code','From → to','Style','Operation','Auth','Gate','Timeout · retries','On failure','Confidence','Evidence'],M.interfaces.slice().sort(byCode).map(i=>'<tr>'+td(lab(i),1)+td(i.from+' → '+i.to+(PI.includes(i)?'':' (not on plan)'))+td(i.style)+td(esc(i.operation||i.protocol))+td(esc(i.auth||'[TBD]'))+td(esc(i.gate||'none'))+td(esc((i.timeout||'[TBD]')+' · '+(i.retries||'[TBD]')))+td(esc(i.failure||'[TBD]'))+td(i.confidence)+td(esc(i.evidence.join(', ')))+'</tr>')));
 r.push('<h2>Flows</h2>'+tbl(['Flow','Trigger','Steps','Evidence'],M.flows.map(f=>'<tr>'+td(esc(f.name)+(f.critical?' (critical)':''),1)+td(esc(f.trigger))+td(f.steps.join(' → '))+td(esc(f.evidence.join(', ')))+'</tr>')));
 if((M.boundaries||[]).length)r.push('<h2>Boundaries</h2>'+tbl(['Code','Name','Kind','Members','Enforced by','Evidence'],M.boundaries.map(b=>'<tr>'+td(lab(b),1)+td(esc(b.name))+td(b.kind)+td(b.members.join(', '))+td(esc(b.enforced_by))+td(esc(b.evidence.join(', ')))+'</tr>')));
 if((M.budgets||[]).length)r.push('<h2>Budgets</h2>'+tbl(['Code','Name','Value','Formula','Applies to','Evidence'],M.budgets.map(b=>'<tr>'+td(lab(b),1)+td(esc(b.name))+td(esc(b.value))+td(esc(b.formula||''))+td(esc(b.applies_to||''))+td(esc(b.evidence.join(', ')))+'</tr>')));
 if((M.unknowns||[]).length)r.push('<h2>Unknowns [TBD]</h2>'+tbl(['Item','Resolve by','Blocks decision'],M.unknowns.map(u=>'<tr>'+td(esc(u.item))+td(esc(u.resolve_by))+td(u.blocks_decision?'yes':'no')+'</tr>')));
 r.push('<h2>Evidence register</h2>'+tbl(['Tag','Kind','Locator','What'],M.evidence.map(e=>'<tr>'+td(e.tag,1)+td(e.kind)+td('<code>'+esc(e.locator)+'</code>')+td(esc(e.what||''))+'</tr>')));
 document.getElementById('appx').innerHTML=r.join('')}

header();begin('sh1');const nbot=notes();DY=Math.max(604,plan()+26);stack(nbot);sequence();
if(M.views.detail==='blast_radius')blast();else failure();
tables();register();document.body.setAttribute('data-ready','1');
})();
</script>
