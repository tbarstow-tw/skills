  - {code: N4, name: claim batch size, value: "1024", applies_to: "I7", evidence: [e29], confidence: VERIFIED}
  - {code: N5, name: shards per group, value: "300", applies_to: "shard id from entity id hash", evidence: [e29, e3], confidence: VERIFIED}

notes:
  - {n: 1, at: C2, text: "A persisted send writes D1 before any network call. Any I5 error falls back to I11, which has no deadline.", evidence: [e6, e7, e8]}
  - {n: 2, at: C2, text: "A volatile send stores nothing and retries without limit every T1 while no runner owns the shard or the owner is down.", evidence: [e5]}
  - {n: 3, at: D1, text: "Dedup works only when the payload has a PrimaryKey. Without one, a caller resend is a new message.", evidence: [e17, e18]}
  - {n: 4, at: C7, text: "The handler can run twice: defect restart, fenced reply, interrupt, failed commit. JSDoc: handlers must tolerate retries.", evidence: [e34, e22, e36, e32]}
  - {n: 5, at: D3, text: "I9 checks the lock after the handler ran, so an old owner's side effects can repeat on the new owner.", confidence: INFERRED, evidence: [e22, e24]}
  - {n: 6, at: C5, text: "Pickup waits up to T3 without a notify. If I13 fails after a crash, claimed rows stay hidden until T4 ends.", evidence: [e20, e25, e15]}
  - {n: 7, at: C6, text: "If I12 fails N2 times or passes T7, the runner interrupts every entity it hosts and claims nothing until a probe passes.", evidence: [e26, e27]}
  - {n: 8, at: D2, text: "An unacked chunk reply keeps its request from being claimed again. Acks never expire.", confidence: INFERRED, evidence: [e14]}
  - {n: 9, text: "Persisted requests act as at-least-once. No document in the repository states a delivery guarantee.", confidence: INFERRED, evidence: [e32]}

unknowns:
  - {item: "Intended delivery guarantee: no README or doc says at-least-once or exactly-once", resolve_by: "Ask the Effect maintainers; read the ai-docs cluster pages at the pinned commit", blocks_decision: true}
  - {item: "What the entity RPC server does when a reply save dies after N1 retries: the request stalls or re-runs", resolve_by: "Trace the defect path in RpcServer.makeNoSerialization; add a test that fails saveReply five times", blocks_decision: true}
  - {item: "How long an old owner keeps running a handler after it loses the shard lock", resolve_by: "Test with a paused runner and a short shardLockExpiration on PostgreSQL", blocks_decision: true}
  - {item: "Runner RPC timeout and auth on the HTTP transport (I5)", resolve_by: "Read makeProtocolHttp and the platform HttpClient defaults", blocks_decision: false}
  - {item: "Lock release for a frozen runner on PostgreSQL before version 14 (no idle_session_timeout)", resolve_by: "Read SqlRunnerStorage connection setup; test on PostgreSQL 13", blocks_decision: false}

