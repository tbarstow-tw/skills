subject:
  mode: question
  kicker: "System drawing · Effect Cluster"
  title: "Cluster message delivery"
  question: "How does a message to a cluster entity travel from the caller to the entity on the runner that owns its shard, and where can delivery fail, stall or run twice?"
  decision: "Which delivery guarantees a service team gets from Effect Cluster with SQL message storage, and which failure modes the team must handle itself."
  dwg_no: SYS-CLUSTER-001
  rev: A
  date: "2026-11-01"
  scope_note: "Persisted requests, SQL storage"
  general_notes:
    - "Codes on the drawing. Values, operations and evidence are in the tables and the register below the sheet."
    - "Snapshot of Effect main at the commit under Source. Rebuild from fresh sources before reuse."
    - "Library subject. Components are runtime roles and stores that Effect Cluster defines. CLIENT is the caller role, SERVICE the owner runner."
    - "Every data edge runs through the SQL client driver C8, a SqlClient from a driver package such as the pg driver. C8 is off the plan."
    - "Budgets are ShardingConfig defaults unless noted. T4, N1 and N2 are fixed in code."
    - "VERIFIED means read in code. DOCUMENTED means stated in JSDoc only. A ? after a code means INFERRED."
  sources:
    - {name: effect, ref: origin/main, sha: e1edcdc8d60bef515a2c5fa97706d4baaf0c0290, date: "2026-11-01"}

lanes: [CLIENT, DATA, PLATFORM, SERVICE]

components:
  - {code: C1, name: Caller code, kind: service, lane: CLIENT, scope: TOUCH, responsibility: "Team code that gets a typed client with Entity.client and calls an entity RPC.", evidence: [e1], confidence: VERIFIED}
  - {code: C2, name: Sharding client, kind: service, lane: CLIENT, scope: FOCUS, responsibility: "Builds the envelope with a Snowflake request id and a shard id, saves persisted requests, routes to the owner and waits for the reply.", evidence: [e2, e3, e4], confidence: VERIFIED}
  - {code: C3, name: Runner RPC client, kind: service, lane: PLATFORM, scope: TOUCH, responsibility: "One RPC client per runner address over HTTP, WebSocket or TCP. Maps transport errors to RunnerUnavailable.", evidence: [e9, e10, e11], confidence: VERIFIED}
  - {code: C4, name: Runner server, kind: service, lane: SERVICE, scope: TOUCH, responsibility: "Receives runner RPCs. For a persisted request it registers a reply handler and wakes the read loop; it does not run the payload.", evidence: [e12], confidence: VERIFIED}
  - {code: C5, name: Storage read loop, kind: job, lane: SERVICE, scope: FOCUS, responsibility: "Claims unprocessed messages for acquired shards and dispatches them to entity managers. Runs forever.", evidence: [e19, e20], confidence: VERIFIED}
  - {code: C6, name: Lock manager, kind: job, lane: SERVICE, scope: FOCUS, responsibility: "Acquires, refreshes and releases shard locks. Resets old claims on new shards. Interrupts all entities when lock storage fails.", evidence: [e25, e26, e27], confidence: VERIFIED}
  - {code: C7, name: Entity manager, kind: service, lane: SERVICE, scope: FOCUS, responsibility: "Activates the entity, holds the mailbox, runs the team's handler, restarts it on a defect, fences and saves the reply.", evidence: [e21, e22, e34], confidence: VERIFIED}
  - {code: C8, name: SQL client driver, kind: service, lane: PLATFORM, scope: CONTEXT, plan: false, responsibility: "SqlClient service from a driver package, such as the pg driver. Carries every data edge.", evidence: [e37, e38], confidence: VERIFIED}
  - {code: D1, name: Messages table, kind: store, lane: DATA, scope: FOCUS, responsibility: "cluster_messages: one row per request or envelope, with processed, last_read lease, deliver_at and a unique message_id for keyed payloads.", evidence: [e14, e17], confidence: VERIFIED}
  - {code: D2, name: Replies table, kind: store, lane: DATA, scope: FOCUS, responsibility: "cluster_replies: chunk and exit replies. At most one exit reply per request.", evidence: [e16, e39], confidence: VERIFIED}
  - {code: D3, name: Shard locks, kind: store, lane: DATA, scope: TOUCH, responsibility: "Advisory locks on PostgreSQL and MySQL; a lease table with expiry on other dialects.", evidence: [e30, e42], confidence: VERIFIED}
  - {code: D4, name: Runner registry, kind: store, lane: DATA, scope: CONTEXT, responsibility: "cluster_runners: registered runners, health and heartbeat. Callers derive shard owners from it.", evidence: [e31, e40], confidence: VERIFIED}

interfaces:
  - {code: I1, name: entity request, from: C1, to: C2, style: sync, protocol: in-process, operation: "Typed RPC call on the entity client; persisted when the RPC carries the Persisted annotation", auth: "none (same process)", gate: "none", timeout: none, retries: none, failure: "Typed errors from I2, I4, I5", evidence: [e1, e33], confidence: VERIFIED}
  - {code: I2, name: save request, from: C2, to: D1, style: data, protocol: SQL, operation: "INSERT the request before any network call. Keyed payloads conflict on message_id and return Duplicate with the last reply", auth: "Database credentials of the SqlClient", gate: "Persisted requests only", timeout: none, retries: none, failure: "PersistenceError to the caller", evidence: [e6, e17, e18], confidence: VERIFIED}
  - {code: I3, name: persisted send, from: C2, to: C3, style: sync, protocol: in-process, operation: "Runners.notify with the owner address from shard assignments; no owner means wait on storage", auth: "none (same process)", gate: "Owner is another runner and the save was not a duplicate", timeout: none, retries: none, failure: "Any error: poll replies (I11)", evidence: [e7, e4], confidence: VERIFIED}
  - {code: I4, name: volatile send, from: C2, to: C3, style: sync, protocol: in-process, operation: "Runners.send for a request without Persisted; nothing is stored", auth: "none (same process)", gate: "Not persisted", timeout: none, retries: unbounded, failure: "Retry every T1 on no owner", evidence: [e5], confidence: VERIFIED}
  - {code: I5, name: runner RPC, from: C3, to: C4, style: sync, protocol: Runner RPC, operation: "Effect or Stream RPC with the encoded envelope and a persisted flag; Notify and Envelope (ack, interrupt) RPCs", auth: "[TBD]", gate: "none", timeout: "[TBD]", retries: none, failure: "RunnerUnavailable to C2", evidence: [e9, e10, e11], confidence: VERIFIED}
  - {code: I6, name: wake read loop, from: C4, to: C5, style: async, protocol: in-process, operation: "sharding.notify with waitUntilRead opens the storage read latch", auth: "none (same process)", gate: "Shard acquired by this runner", timeout: none, retries: none, failure: "EntityNotAssignedToRunner", evidence: [e12, e13], confidence: VERIFIED}
  - {code: I7, name: claim messages, from: C5, to: D1, style: data, protocol: SQL, operation: "UPDATE last_read on unprocessed rows of acquired shards with no exit reply and no unacked chunk, whose lease is older than T4, in batches of N4", auth: "Database credentials of the SqlClient", gate: "Latch opened by I6 or every T3", timeout: none, retries: unbounded, failure: "Logged; next poll retries", evidence: [e14, e15, e20], confidence: VERIFIED}
  - {code: I8, name: dispatch message, from: C5, to: C7, style: sync, protocol: in-process, operation: "Decode, skip ids already active or processed, check mailbox capacity N3, write to the entity RPC server", auth: "none (same process)", gate: "Entity type registered within T9", timeout: none, retries: unbounded, failure: "MailboxFull: resumption retries", evidence: [e19, e21, e41], confidence: VERIFIED}
  - {code: I9, name: confirm shard lock, from: C7, to: D3, style: data, protocol: SQL, operation: "Refresh this shard's lock before saving a persisted reply; one shared refresh per shard", auth: "Database credentials of the SqlClient", gate: "Persisted request", timeout: T7, retries: none, failure: "Reply dropped; request re-runs", evidence: [e22, e24], confidence: VERIFIED}
  - {code: I10, name: save reply, from: C7, to: D2, style: data, protocol: SQL, operation: "One transaction: UPDATE D1 processed for the request, INSERT the exit reply. Chunks only set last_reply_id", auth: "Database credentials of the SqlClient", gate: "Lock confirmed by I9", timeout: none, retries: N1, failure: "Defect after N1 retries", evidence: [e16, e22, e23], confidence: VERIFIED}
  - {code: I11, name: poll replies, from: C2, to: D2, style: data, protocol: SQL, operation: "Read replies for waiting requests every T2 until an exit reply arrives", auth: "Database credentials of the SqlClient", gate: "Persisted request waiting on storage", timeout: none, retries: unbounded, failure: "No deadline; caller waits", evidence: [e8], confidence: VERIFIED}
  - {code: I12, name: acquire and refresh, from: C6, to: D3, style: data, protocol: SQL, operation: "Acquire locks for assigned shards; refresh held locks every T7 with N2 retries", auth: "Database credentials of the SqlClient", gate: "none", timeout: T7, retries: N2, failure: "Interrupt every entity", evidence: [e26, e27, e28, e30], confidence: VERIFIED}
  - {code: I13, name: reset claims, from: C6, to: D1, style: data, protocol: SQL, operation: "resetShards clears last_read on newly acquired shards so the previous owner's claims are visible again", auth: "Database credentials of the SqlClient", gate: "After a lock is acquired", timeout: T7, retries: none, failure: "Ignored; rows wait for T4", evidence: [e25], confidence: VERIFIED}
  - {code: I14, name: read runners, from: C2, to: D4, style: data, protocol: SQL, operation: "getRunners, then a hash ring maps shards to runners; repeats every refreshAssignmentsInterval", auth: "Database credentials of the SqlClient", gate: "none", evidence: [e40, e43, e44], confidence: VERIFIED}

flows:
  - {id: persisted, name: "Persisted request to a remote owner", trigger: "Caller calls a Persisted entity RPC whose shard another runner owns", critical: true, steps: [I1, I2, I3, I5, I6, I7, I8, I9, I10], evidence: [e6, e7, e12, e14, e22]}
  - {id: fallback, name: "Owner missing or RPC fails: caller waits on storage", trigger: "No owner in shard assignments, or any I5 error", steps: [I1, I2, I3, I11], evidence: [e7, e8]}
  - {id: volatile, name: "Volatile request", trigger: "RPC without the Persisted annotation", steps: [I1, I4, I5], evidence: [e5]}
  - {id: takeover, name: "New owner takes a shard", trigger: "Rebalance or a runner stops refreshing its locks", steps: [I12, I13, I7], evidence: [e25, e26]}

boundaries:
  - {code: B1, name: Caller process, kind: deploy, members: [C1, C2, C3], enforced_by: "Any runner or client-only process that holds an entity client", evidence: [e2, e10], confidence: VERIFIED}
  - {code: B2, name: Owner runner, kind: deploy, members: [C4, C5, C6, C7], enforced_by: "The runner process that holds the lock for the shard", evidence: [e12, e25], confidence: VERIFIED}
  - {code: B3, name: Shard ownership, kind: trust, members: [C5, C7], enforced_by: "Only acquired shards are claimed (I7) and each persisted reply is fenced by a lock refresh (I9). No fencing token in the SQL writes.", evidence: [e19, e24], confidence: VERIFIED}
  - {code: B4, name: SQL database, kind: deploy, members: [D1, D2, D3, D4], enforced_by: "One SqlClient. Tables share the cluster prefix. Default layers run migrations and need DDL rights.", evidence: [e38, e31], confidence: VERIFIED}

