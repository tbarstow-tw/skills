<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*__TITLE__*/</title>
<style>
/* System drawing sheet. Adapted from enesozturk/dimensional-drawing (MIT); see THIRD_PARTY_NOTICES.md. Light theme only by design. */
@font-face{font-family:'Arimo';src:url(data:font/woff2;base64,/*__FONT__*/) format('woff2');font-weight:400 700}
:root{--paper:#ececec;--sheet:#ffffff;--ink:#111111;--ink2:#444444;--ink3:#7a7a7a;--fill:#f3f3f3;--fill2:#e6e6e6;--f:'Arimo';color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f)}
.wrap{max-width:1760px;margin:0 auto;padding:24px 16px 40px}
.scroll{overflow-x:auto;background:var(--sheet);border:1.2px solid var(--ink);border-radius:16px}
svg{display:block;width:100%;min-width:1100px;height:auto}
.tb{background:var(--sheet);display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;margin-bottom:24px;border:1.2px solid var(--ink);border-radius:16px;overflow:hidden}
.tb>div{border-right:.8px solid var(--ink);border-bottom:.8px solid var(--ink);padding:10px 14px;min-width:0}
.tb>div:nth-child(4),.tb>div:nth-child(7){border-right:0}
.tb .big{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tb h1{font-weight:400;letter-spacing:.1em;font-size:clamp(26px,3.6vw,40px);line-height:1.05;margin:4px 0 0;text-transform:uppercase}
.lbl{text-transform:uppercase;font-size:9.5px;letter-spacing:.06em;color:var(--ink2)}
.tb .v{font-size:12.5px;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere}
.tb .big .v{font-size:11px;color:var(--ink2);line-height:1.6;text-transform:none;letter-spacing:.02em}
.tb .notes{grid-column:1/-1;border-right:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;line-height:1.8}
.tb .notes ol{margin:4px 0 0;padding-left:20px}
.tb .nh{font-weight:700;font-size:13px;letter-spacing:.06em}
.tb .nh span{font-weight:400;font-size:11px;margin-left:6px}
/* Dividers are shadows so they run the full cell height; the card clips the ones on its outer edge. */
.tb .figs{grid-column:1/-1;border-right:0;border-bottom:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0}
.tb .figs>div{padding:10px 14px;box-shadow:-.8px 0 0 var(--ink),0 -.8px 0 var(--ink)}
.tb .figs .v{font-size:15px;letter-spacing:.04em;text-transform:none;margin-top:4px}
@media (max-width:640px){.tb{grid-template-columns:1fr 1fr}.tb .big{grid-column:1/-1;grid-row:auto}}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:10px 2px 0}
.foot b{font-weight:700;color:var(--ink)}
.appx{background:var(--sheet);margin-top:28px;padding:20px 24px;border:1.2px solid var(--ink);border-radius:16px}
.appx h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}
.appx h2:first-child{margin-top:0}
.appx table{border-collapse:collapse;width:100%;font-size:12px}
.appx th,.appx td{border:.8px solid var(--ink3);padding:4px 8px;text-align:left;vertical-align:top}
.appx th{font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.appx td.c{white-space:nowrap;font-weight:700}
.appx code{font-size:11px;overflow-wrap:anywhere}
/* drawing */
.obj{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.cmp{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.ctx{fill:var(--sheet);stroke:var(--ink2);stroke-width:.6}
.k-store{fill:var(--fill)}
.k-ext{fill:var(--fill2)}
.tbd{stroke-dasharray:2 2}
.thin{fill:none;stroke:var(--ink);stroke-width:.8}
.plane{fill:var(--sheet);stroke:var(--ink);stroke-width:.8}
.ph{fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:14 3 3 3}
.cl{fill:none;stroke:var(--ink3);stroke-width:.7;stroke-dasharray:16 3 2 3}
.bnd{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:10 3 2 3}
.dep{fill:none;stroke:var(--ink2);stroke-width:.55}
.call{fill:none;stroke:var(--ink);stroke-width:.9}
.msg{fill:none;stroke:var(--ink);stroke-width:.9;stroke-dasharray:4 3}
.data{fill:none;stroke:var(--ink);stroke-width:.9}
.crit{stroke-width:1.5}
.arrow{fill:var(--ink)}
.arrowo{fill:none;stroke:var(--ink);stroke-width:1}
.hl{stroke:var(--ink2);stroke-width:.7}
.hs{stroke:var(--ink);stroke-width:.6}
.lead{stroke:var(--ink);stroke-width:.7;fill:none}
.dot{fill:var(--ink)}
.dt{font:400 11px var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.dts{font:400 9.5px var(--f);fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.cc{font:700 11px var(--f);fill:var(--ink);letter-spacing:.04em}
.sl{font:400 9px var(--f);fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.nt{font:400 10.5px var(--f);fill:var(--ink);letter-spacing:.05em;text-transform:uppercase}
.nth{font:700 13px var(--f);fill:var(--ink);letter-spacing:.06em}
.vt{font:400 12px var(--f);fill:var(--ink);letter-spacing:.1em;text-transform:uppercase}
.nb{fill:var(--sheet);stroke:var(--ink);stroke-width:.9}
.nbt{font:400 9.5px var(--f);fill:var(--ink)}
.stc{fill:var(--sheet);stroke:var(--ink);stroke-width:.9}
.stt{font:700 8.5px var(--f);fill:var(--ink)}
.th{font:400 9px var(--f);fill:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.tc{font:400 9.5px var(--f);fill:var(--ink)}
.tbk{font:400 7px var(--f);fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.ko{paint-order:stroke;stroke:var(--fill2);stroke-width:3px;stroke-linejoin:round}
.iso{font:700 8px var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="tb" id="tb"></header>
  <div class="scroll"><svg id="sh1" viewBox="0 0 1700 1060" role="img"></svg></div>
  <div class="foot" id="foot"></div>
  <section class="appx" id="appx"></section>
</div>
<script type="application/json" id="model">/*__MODEL__*/</script>
<script>
(function(){
const M=JSON.parse(document.getElementById('model').textContent);
const NS='http://www.w3.org/2000/svg';let sv,A,AO,DOT,HAT;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- kit (helpers adapted from the upstream drawing kit) ---- */
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)if(a[k]!=null)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e}
function tx(x,y,s,c,a,p){const t=mk('text',Object.assign({x:x,y:y,class:c||'dt'},a||{}),p);t.textContent=s;return t}
function rr(x,y,w,h,r,c,p){return mk('rect',{x:x,y:y,width:w,height:h,rx:r,class:c},p)}
function begin(id){sv=document.getElementById(id);sv.innerHTML='';const d=mk('defs',{});
 const m=mk('marker',{id:'ar',viewBox:'0 0 10 10',refX:10,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},d);mk('path',{d:'M0,1.7 L10,5 L0,8.3 z',class:'arrow'},m);
 const o=mk('marker',{id:'aro',viewBox:'0 0 10 10',refX:10,refY:5,markerWidth:8,markerHeight:8,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},d);mk('path',{d:'M0,1.5 L10,5 L0,8.5',class:'arrowo'},o);
 const c=mk('marker',{id:'dot',viewBox:'0 0 10 10',refX:5,refY:5,markerWidth:6,markerHeight:6,markerUnits:'userSpaceOnUse'},d);mk('circle',{cx:5,cy:5,r:4,class:'dot'},c);
 const pt=mk('pattern',{id:'hat',width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},d);mk('line',{x1:0,y1:0,x2:0,y2:5,class:'hl'},pt);
 A='url(#ar)';AO='url(#aro)';DOT='url(#dot)';HAT='url(#hat)'}
function nb(x,y,n){const w=Math.max(12,String(n).length*6.5+4);mk('rect',{x:x-w/2,y:y-6,width:w,height:12,class:'nb'});tx(x,y+3.5,String(n),'nbt',{'text-anchor':'middle'})}
function step(x,y,n){mk('circle',{cx:x,cy:y,r:6.5,class:'stc'});tx(x,y+3,String(n),'stt',{'text-anchor':'middle'})}
function title(x,y,t,s){tx(x,y,t,'vt',{'text-anchor':'middle'});if(s)tx(x,y+14,s,'dts',{'text-anchor':'middle'})}
function fit(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function wrap(s,n){const w=String(s).split(/\s+/),out=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){if(l)out.push(l);l=x}else l=(l+' '+x).trim()});if(l)out.push(l);return out}

/* ---- model lookups ---- */
const C={};M.components.forEach(c=>C[c.code]=c);
const I={};M.interfaces.forEach(i=>I[i.code]=i);
/* plan: false keeps an item in the tables and register but off the context plan and layer stack */
const PC=M.components.filter(c=>c.plan!==false),PCS=new Set(PC.map(c=>c.code));
const PI=M.interfaces.filter(i=>i.plan!==false&&PCS.has(i.from)&&PCS.has(i.to));
const byCode=(a,b)=>a.code[0]===b.code[0]?+a.code.slice(1)-+b.code.slice(1):a.code<b.code?-1:1;
const BUD={};(M.budgets||[]).forEach(b=>BUD[b.code]=b);
const lab=o=>o.code+(o.confidence==='INFERRED'?'?':'');
const noteLab=n=>n.n+(n.confidence==='INFERRED'?'?':'');
const crit=M.flows.find(f=>f.critical)||M.flows[0];
const stepOf={};crit.steps.forEach((s,k)=>{if(!(s in stepOf))stepOf[s]=k+1});

/* ---- title block, footer ---- */
function header(){const s=M.subject,g=s.general_notes||[],h=Math.ceil(g.length/2);
 const src=s.sources.map(x=>esc(x.name)+' @'+esc(x.sha.slice(0,7))).join('<br>');
 const ol=(a,st)=>'<ol start="'+st+'">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
 document.getElementById('tb').innerHTML=
 '<div class="big"><div><div class="lbl">'+esc(s.kicker||'System drawing')+' · '+esc(s.mode)+' mode</div><h1>'+esc(s.title)+'</h1></div><div class="v">'+esc(s.question)+'<br><b>Decision:</b> '+esc(s.decision)+'</div></div>'+
 '<div><div class="lbl">Dwg no.</div><div class="v">'+esc(s.dwg_no)+'</div></div>'+
 '<div><div class="lbl">Rev</div><div class="v">'+esc(s.rev)+' · '+esc(s.date)+'</div></div>'+
 '<div><div class="lbl">Sheets</div><div class="v">1 + register</div></div>'+
 '<div><div class="lbl">Mode</div><div class="v">'+esc(s.mode)+'</div></div>'+
 '<div><div class="lbl">Scope</div><div class="v">'+esc(s.scope_note||'One subject')+'</div></div>'+
 '<div><div class="lbl">Source</div><div class="v">'+src+'</div></div>'+
 '<div class="notes"><div><span class="nh">NOTES:<span>(UNLESS OTHERWISE SPECIFIED)</span></span>'+ol(g.slice(0,h),1)+'</div><div><span class="nh" aria-hidden="true">&nbsp;</span>'+ol(g.slice(h),h+1)+'</div></div>'+
 '<div class="figs">'+M.key_figures.map(f=>'<div><div class="lbl">'+esc(f.code)+' · '+esc(f.label)+'</div><div class="v">'+esc(f.value)+'</div></div>').join('')+'</div>';
 document.getElementById('foot').innerHTML='<span>'+esc(s.date)+' &nbsp;|&nbsp; System reference</span><span><b>'+esc(s.title)+', '+esc(s.mode)+'</b> &nbsp;|&nbsp; 1</span>';
 document.title=s.title+' · System Drawing';
 document.getElementById('sh1').setAttribute('aria-label','Sheet 1: context plan, layer stack, sequence detail, '+M.views.detail.replace('_',' ')+' detail, tables');}

/* ---- notes (top left) ---- */
function notes(){const NX=50;let y=58;tx(NX,y,'NOTES:','nth');tx(NX+62,y,'(UNLESS OTHERWISE SPECIFIED)','nt');y+=28;
 M.notes.forEach(n=>{nb(NX+6,y-4,noteLab(n));wrap(n.text.toUpperCase(),50).forEach((l,i)=>{tx(NX+22,y,l,'nt');y+=14});y+=5});return y}

/* ---- context plan: fixed lanes, ordered columns ----
   Legibility rules (check.py enforces them):
   - Parallel edge segments run at least TRACK apart. Edges whose horizontal runs do not overlap share a track.
   - Edge ends on one box side sit at least PORT apart.
   - Gutters grow to fit their tracks, with a MARGIN between tracks and boxes or frames.
   - Labels never sit on another edge, a box, a frame or another label. */
const PL={x0:432,x1:1380,y0:52,bw:118,bh:40,lw:66,TRACK:10,PORT:14,MARGIN:12,maxBottom:612};
/* The plan may use every pixel the details do not need at their minimum legible step (SEQ_STEP). */
const SEQ_STEP=22,SEQ_HEAD=46+28,DETAIL_BASE=985;
function detailNeed(){const f=M.flows.find(x=>x.id===M.views.sequence_flow)||M.flows.find(x=>x.critical)||M.flows[0];let need=SEQ_HEAD+f.steps.length*SEQ_STEP;
 if(M.views.detail==='failure'){const i=M.interfaces.find(x=>x.code===M.views.failure_interface);if(i){let h=76;[i.timeout,i.retries,i.failure,i.gate,i.auth].forEach(v=>{h+=wrap(String(v||'[TBD]'),36).length*14+12});need=Math.max(need,h)}}
 else need=Math.max(need,370);return need}
const AX0=PL.x0+PL.lw,AX1=PL.x1,AW=AX1-AX0;
const laneIx={};M.lanes.forEach((l,i)=>laneIx[l]=i);
let NODES={},COLS=1,LT=[],GUT=[];
const boxY=i=>LT[i]+PL.MARGIN, laneBottom=i=>boxY(i)+PL.bh;
function layout(seed){const byLane=M.lanes.map(()=>[]);PC.forEach(c=>byLane[laneIx[c.lane]].push(c.code));
 if(seed){let r=seed*9301+49297;const rnd=()=>(r=(r*9301+49297)%233280)/233280;byLane.forEach(a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(rnd()*(k+1));[a[k],a[j]]=[a[j],a[k]]}})}
 COLS=Math.max(...byLane.map(a=>a.length),4);const p={};
 byLane.forEach(a=>a.forEach((c,k)=>p[c]=(k+.5)/a.length));
 const nbr={};PC.forEach(c=>nbr[c.code]=[]);PI.forEach(i=>{nbr[i.from].push(i.to);nbr[i.to].push(i.from)});
 const col={};
 function assign(){byLane.forEach(a=>{const s=a.slice().sort((x,y)=>p[x]-p[y]),used=new Set();
  s.forEach(c=>{let t=Math.min(COLS-1,Math.max(0,Math.round(p[c]*COLS-.5)));let d=0;while(used.has(t+d)&&used.has(t-d))d++;t=!used.has(t+d)&&t+d<COLS?t+d:(!used.has(t-d)&&t-d>=0?t-d:[...Array(COLS).keys()].find(k=>!used.has(k)));used.add(t);col[c]=t});
  a.forEach(c=>p[c]=(col[c]+.5)/COLS)})}
 assign();
 for(let it=0;it<4;it++){const q={};PC.forEach(c=>{const n=nbr[c.code].filter(x=>C[x].lane!==c.lane);q[c.code]=n.length?n.reduce((s,x)=>s+p[x],0)/n.length:p[c.code]});Object.assign(p,q);assign()}
 NODES={};const slot=AW/COLS;PC.forEach(c=>{const li=laneIx[c.lane],cx=AX0+slot*(col[c.code]+.5);NODES[c.code]={cx:cx,x:cx-PL.bw/2,li:li,col:col[c.code]}});}
let CORR=[];
function freeX(x,lo,hi){for(let li=lo;li<=hi;li++){for(const k in NODES){const n=NODES[k];if(n.li===li&&x>n.x-8&&x<n.x+PL.bw+8)return false}
 if(CORR.some(c=>c.li===li&&x>c.x0-8&&x<c.x1+8))return false}return true}
function routes(){const ports={},pairs={},n=M.lanes.length;
 const side=(code,s)=>(ports[code+s]=ports[code+s]||[]);
 const adj=(a,b)=>a.li===b.li&&!Object.values(NODES).some(q=>q.li===a.li&&q.col>Math.min(a.col,b.col)&&q.col<Math.max(a.col,b.col));
 const groups={};PI.forEach(i=>{const k=i.from+'|'+i.to+'|'+i.style;(groups[k]=groups[k]||[]).push(i)});
 const E=Object.values(groups).map(G=>{G.sort((x,y)=>+x.code.slice(1)-+y.code.slice(1));const i=G[0],a=NODES[i.from],b=NODES[i.to];const e={i:i,G:G,a:a,b:b};
  if(adj(a,b)){const k=[i.from,i.to].sort().join('|');(pairs[k]=pairs[k]||[]).push(e);e.side=true;return e}
  let sa,sb;if(a.li<b.li){sa='b';sb='t'}else if(a.li>b.li){sa='t';sb='b'}else{sa='b';sb='b'}
  e.sa=sa;e.sb=sb;side(i.from,sa).push([e,'a',b.cx]);side(i.to,sb).push([e,'b',a.cx]);return e});
 CORR=Object.values(pairs).map(L=>{const a=L[0].a,b=L[0].b;return {li:a.li,x0:Math.min(a.x,b.x)+PL.bw,x1:Math.max(a.x,b.x)}});
 /* ports: spread at PORT spacing, centered on the box */
 for(const k in ports){const L=ports[k].sort((x,y)=>x[2]-y[2]),m=L.length,N=NODES[k.slice(0,-1)],sp=m>1?Math.min(PL.PORT*1.4,(PL.bw-20)/(m-1)):0;
  if(m>1&&sp<PL.PORT)sv.setAttribute('data-port-crowded',(sv.getAttribute('data-port-crowded')||'')+k.slice(0,-1)+' ');
  L.forEach(([e,end],j)=>{e['p'+end]=N.cx+(j-(m-1)/2)*sp})}
 /* vertical runs through intermediate lanes */
 const vcol={};E.forEach(e=>{if(e.side)return;const la=e.a.li,lb=e.b.li;if(Math.abs(la-lb)<=1)return;const lo=Math.min(la,lb)+1,hi=Math.max(la,lb)-1;
  const cand=[e.pa,e.pb];for(let k=0;k<=COLS;k++)cand.push(AX0+AW/COLS*k);
  cand.sort((x,y)=>(Math.abs(x-e.pa)+Math.abs(x-e.pb))-(Math.abs(y-e.pa)+Math.abs(y-e.pb)));let xv=cand.find(x=>freeX(x,lo,hi));if(xv==null)xv=e.pa;
  const key=Math.round(xv),k=vcol[key]=(vcol[key]||0)+1;e.xv=xv+(k>1?((k%2?1:-1)*Math.ceil((k-1)/2)*PL.TRACK):0)});
 /* horizontal runs per gutter: interval colouring, so runs that do not overlap share a track */
 const runs=[...Array(n)].map(()=>[]);
 E.forEach(e=>{if(e.side)return;const la=e.a.li,lb=e.b.li;
  if(la===lb){e.g1=la;runs[la].push([e,1,Math.min(e.pa,e.pb),Math.max(e.pa,e.pb)]);return}
  const down=la<lb;e.g1=down?la:la-1;e.g2=down?lb-1:lb;
  if(Math.abs(la-lb)<=1){runs[e.g1].push([e,1,Math.min(e.pa,e.pb),Math.max(e.pa,e.pb)]);e.g2=e.g1;return}
  runs[e.g1].push([e,1,Math.min(e.pa,e.xv),Math.max(e.pa,e.xv)]);runs[e.g2].push([e,2,Math.min(e.xv,e.pb),Math.max(e.xv,e.pb)])});
 GUT=runs.map(R=>{R.sort((x,y)=>x[2]-y[2]);const ends=[];R.forEach(r=>{let t=ends.findIndex(x=>x+PL.TRACK*1.5<r[2]);if(t<0){t=ends.length;ends.push(0)}ends[t]=r[3];r.push(t)});return {R:R,n:ends.length}});
 /* lane tops: each gutter grows to fit its tracks */
 LT=[PL.y0];for(let i=0;i<n;i++){const g=GUT[i];LT.push(laneBottom(i)+(g.n?2*PL.MARGIN+g.n*PL.TRACK:(i<n-1?2*PL.MARGIN:PL.MARGIN)))}
 Object.values(NODES).forEach(N=>N.y=boxY(N.li));
 GUT.forEach((g,i)=>g.R.forEach(([e,w,,,t])=>{e['y'+w]=laneBottom(i)+PL.MARGIN+PL.TRACK/2+t*PL.TRACK}));
 for(const k in pairs){const L=pairs[k],m=L.length;L.forEach((e,j)=>{const y=e.a.y+PL.bh/2+(j-(m-1)/2)*Math.min(PL.PORT,(PL.bh-8)/Math.max(m-1,1)),l=e.a.cx<e.b.cx;
  e.pts=[[l?e.a.x+PL.bw:e.a.x,y],[l?e.b.x:e.b.x+PL.bw,y]]})}
 E.forEach(e=>{if(e.side)return;const a=e.a,b=e.b,ya=e.sa==='b'?a.y+PL.bh:a.y,yb=e.sb==='b'?b.y+PL.bh:b.y;let pts;
  if(e.xv==null)pts=[[e.pa,ya],[e.pa,e.y1],[e.pb,e.y1],[e.pb,yb]];
  else pts=[[e.pa,ya],[e.pa,e.y1],[e.xv,e.y1],[e.xv,e.y2],[e.pb,e.y2],[e.pb,yb]];
  e.pts=pts.filter((p,k)=>k===0||p[0]!==pts[k-1][0]||p[1]!==pts[k-1][1])});
 sv.setAttribute('data-gutter-tracks',GUT.map(g=>g.n).join(','));

 if((M.boundaries||[]).length)r.push('<h2>Boundaries</h2>'+tbl(['Code','Name','Kind','Members','Enforced by','Evidence'],M.boundaries.map(b=>'<tr>'+td(lab(b),1)+td(esc(b.name))+td(b.kind)+td(b.members.join(', '))+td(esc(b.enforced_by))+td(esc(b.evidence.join(', ')))+'</tr>')));

 if((M.unknowns||[]).length)r.push('<h2>Unknowns [TBD]</h2>'+tbl(['Item','Resolve by','Blocks decision'],M.unknowns.map(u=>'<tr>'+td(esc(u.item))+td(esc(u.resolve_by))+td(u.blocks_decision?'yes':'no')+'</tr>')));
